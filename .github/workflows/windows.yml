name: windows

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Test Makefile on Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Java and Maven
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - name: Cache downloaded dependencies
      uses: actions/cache@v4
      with:
        path: C:\Users\runneradmin\.m2\repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Build Windows ZIP distribution
      shell: cmd
      run: .\make.exe zip-win
    - name: Copy Windows ZIP distribution out of the Maven repository
      shell: pwsh
      run: Copy-Item "$env:USERPROFILE\.m2\repository\org\daisy\pipeline\assembly\*\assembly-*-win.zip" -Destination .
    - name: Upload Windows ZIP distribution
      uses: actions/upload-artifact@v4
      with:
        name: pipeline2-win
        path: assembly-*-win.zip
        if-no-files-found: error
